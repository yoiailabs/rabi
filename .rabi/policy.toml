schema = 1
default-tier = "medium"

# Path tiers are a coarse default; the written assessment under risk-tiers.md
# decides whether a change is escalated. Floors make `rabi task merge` require
# a maintainer approval; see risk-tiers.md for delegated changes under a floor.
[[rule]]
paths = [".github/workflows/**"]
# Documents the cost floor; also covered by the built-in .github/** floor.
floor = true # GitHub Actions can affect pay-as-you-go cost.

[ci]
required = [
  "Rust fmt",
  "Rust clippy",
  "Rust test",
  "Rust test (musl)",
  "Installer (ubuntu-latest)",
  "Installer (macos-latest)",
]

# Tiers `rabi task merge` may merge without a maintainer approval, after the
# written assessment finds no escalation condition in risk-tiers.md.
[merge]
auto = ["low", "medium"]
method = "squash"

[approval]
approvers = ["aku11i"]
