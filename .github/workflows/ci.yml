name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # rust-cache saves to the Actions cache. contents: read alone cannot write it.
  actions: write

jobs:
  fmt:
    name: Rust fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          components: rustfmt
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          components: clippy
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Rust test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
      - name: Install shells for smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
          command -v bash zsh fish
      - name: All tests
        run: cargo test --locked

  test-musl:
    name: Rust test (musl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
        with:
          key: x86_64-unknown-linux-musl
      - name: Install shells for smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
          command -v bash zsh fish
      - name: Unit and CLI tests (musl)
        run: cargo test --locked --lib --test cli --target x86_64-unknown-linux-musl

  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh tests/install/*.sh
      - name: Installer tests (sh)
        run: sh tests/install/run.sh
      - name: Installer tests (dash)
        if: runner.os == 'Linux'
        run: dash tests/install/run.sh
      - name: Install additional awk implementations
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y original-awk busybox
      - name: Installer tests (original-awk and BusyBox awk)
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/awk-original" "$RUNNER_TEMP/awk-busybox"
          ln -s /usr/bin/original-awk "$RUNNER_TEMP/awk-original/awk"
          printf '#!/bin/sh\nexec /usr/bin/busybox awk "$@"\n' > "$RUNNER_TEMP/awk-busybox/awk"
          chmod +x "$RUNNER_TEMP/awk-busybox/awk"
          PATH="$RUNNER_TEMP/awk-original:$PATH" sh tests/install/run.sh
          PATH="$RUNNER_TEMP/awk-busybox:$PATH" sh tests/install/run.sh
