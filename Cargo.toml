[package]
name = "rabi"
version = "7.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Isolated Git workspaces for parallel coding agents: local Git workspaces so many agents and humans can work independently in one repository"
keywords = ["git", "worktree", "workspace", "agents", "cli"]
categories = ["command-line-utilities", "development-tools"]
license = "MIT"
repository = "https://github.com/yoiailabs/rabi"

[[bin]]
name = "rabi"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
terminal_size = "0.4"
thiserror = "2"
toml_edit = { version = "0.25.17", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"
